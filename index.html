<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRFLICKR · Reconstruction &amp; Uncertainty</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="heatmap-pixels.css">
<link rel="stylesheet" href="example-browser.css">
<script src="heatmap-pixels.js"></script>
<script src="example-browser.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header>
<p class="eyebrow">MIRFLICKR · LENSLESS IMAGING</p>
<h1>Reconstruction &amp; uncertainty</h1>
</header>
<main>
<nav class="controls">
  <label>Image <select id="example"></select></label>
  <button id="previous" aria-label="Previous">←</button>
  <button id="next" aria-label="Next">→</button>
  <button id="random">Random</button>
  <span id="status" role="status" aria-live="polite">Loading…</span>
</nav>

<section class="inputs" aria-label="Input and reference">
  <figure><figcaption>Camera input</figcaption><canvas id="measurement" width="480" height="270"></canvas></figure>
  <figure><figcaption>Ground truth</figcaption><canvas id="target" width="480" height="270"></canvas></figure>
</section>

<section aria-label="Model outputs">
  <div class="guide">
    <div><b>Error</b> = |ground truth − prediction| &nbsp; <b>Uncertainty</b> = upper − lower</div>
    <div class="map-key">
      <span class="gradient" aria-hidden="true"></span>
      <span>0 → 1</span>
    </div>
    <label class="bounds-toggle"><input type="checkbox" id="showBounds"> Show bounds</label>
  </div>
  <div id="matrix" class="matrix"></div>
  <p class="hint">Click a pixel to inspect its value. <span class="badge">Display: clipped [0,1]</span></p>

  <details id="pixelInspector">
    <summary>Inspect a pixel</summary>
    <div class="detail-body">
      <h2 id="pixelTitle">Selected pixel</h2>
      <label>Channel
        <select id="channel">
          <option value="rgb">RGB average</option>
          <option value="0">Red</option>
          <option value="1">Green</option>
          <option value="2">Blue</option>
        </select>
      </label>
      <p id="pixelTruth"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Model</th><th>Prediction</th><th>Lower</th><th>Upper</th><th>Error</th><th>Width</th></tr></thead>
          <tbody id="pixelRows"></tbody>
        </table>
      </div>
    </div>
  </details>
</section>
</main>
<footer>MIRFLICKR · QUTCC / Im2im</footer>
</body>
</html>
